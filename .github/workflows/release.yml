# SPDX-License-Identifier: GPL-3.0-only
#
# Builds and publishes one release. Runs when the maintainer pushes a
# signed tag vX.Y.Z (after scripts/release-preflight.sh passes), or on
# demand for an existing tag. The tag's own tree is built; the release
# tooling (scripts/, pkg/, docs/releases/) always comes from main, so old
# tags can be rebuilt with today's tooling.
#
#   build      tunnelward for five targets, packaged with licences
#   publish    SHA256SUMS (cosign-signed), CycloneDX SBOM, SLSA
#              provenance, Homebrew formula, release notes, GitHub Release
#   container  multi-arch distroless image on GHCR, cosign-signed
#   crates     the workspace's publishable crates on crates.io, through
#              trusted publishing (OIDC, no stored token). Runs once the
#              repository variable CRATES_IO_TRUSTED_PUBLISHING is "true",
#              which needs each crate to exist on crates.io and to name
#              this workflow as its trusted publisher. A crate already on
#              crates.io at this version is skipped, so a rerun resumes;
#              a crate new to crates.io stops the job before publishing.
#
# Verify an asset:   gh attestation verify --owner sebastienrousseau <file>
# Verify checksums:  cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
#   --certificate-identity-regexp '^https://github\.com/sebastienrousseau/tunnelward/' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com
# Verify the image:  cosign verify ghcr.io/sebastienrousseau/tunnelward:<v> \
#   --certificate-identity-regexp '^https://github\.com/sebastienrousseau/tunnelward/' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.0.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - id: check
        run: |
          set -euo pipefail
          version="${TAG#v}"
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$manifest" != "$version" ]; then
            echo "::error::tag $TAG but the workspace version is $manifest"
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG is not an annotated tag"
            exit 1
          fi
          first="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
          if [ "$first" != "tunnelward $TAG" ]; then
            echo "::error::tag message is '$first', expected 'tunnelward $TAG'"
            exit 1
          fi
          newest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$newest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p tunnelward --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="tunnelward-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          exe=tunnelward
          [[ "$TARGET" == *windows* ]] && exe=tunnelward.exe
          cp -R "target/$TARGET/release/$exe" README.md CHANGELOG.md LICENSE* "dist/$name/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-cyclonedx
      - name: SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path crates/tw-cli/Cargo.toml --format json --override-filename "tunnelward-$VERSION.cdx"
          mv "crates/tw-cli/tunnelward-$VERSION.cdx.json" dist/
      - name: Homebrew formula
        run: bash tooling/scripts/render-formula.sh "$VERSION" dist > dist/tunnelward.rb
      - name: Checksums
        run: cd dist && sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums
        # Keyless: the bundle ties SHA256SUMS to this workflow run.
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Release notes
        run: bash tooling/scripts/release-notes.sh "$TAG" dist tooling/docs/releases > notes.md
      - name: Create or update the release
        env:
          LATEST: ${{ needs.validate.outputs.latest }}
        run: |
          set -euo pipefail
          title="tunnelward $VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md --latest="$LATEST"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$title" --notes-file notes.md --latest="$LATEST"
          fi

  container:
    name: Container image
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Lay out the build context
        run: |
          set -euo pipefail
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"; target="${pair##*:}-unknown-linux-musl"
            mkdir -p "ctx/linux/$arch"
            tar xzf "dist/tunnelward-$VERSION-$target.tar.gz" -C ctx --strip-components=1 "tunnelward-$VERSION-$target/tunnelward"
            mv ctx/tunnelward "ctx/linux/$arch/tunnelward"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: tags
        env:
          LATEST: ${{ needs.validate.outputs.latest }}
        run: |
          tags="$IMAGE:$VERSION"
          [ "$LATEST" = true ] && tags="$tags,$IMAGE:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          file: tooling/pkg/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

  crates:
    name: Publish to crates.io
    needs: [validate, publish]
    if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - id: check
        name: Plan the publish
        # A crate crates.io has at this version is skipped, so a rerun
        # finishes what an earlier run started. A crate crates.io has never
        # seen stops the job before anything is published: trusted
        # publishing cannot create a crate, so the maintainer publishes it
        # once by hand and adds its trusted publisher.
        run: |
          set -euo pipefail
          status() {
            curl -s -o /dev/null -w '%{http_code}' -A 'tunnelward-release (github.com/sebastienrousseau/tunnelward)' \
              "https://crates.io/api/v1/crates/$1${2:+/$2}"
          }
          new=(); done_=(); todo=0
          while IFS= read -r name; do
            if [ "$(status "$name")" = 404 ]; then new+=("$name")
            elif [ "$(status "$name" "$VERSION")" = 200 ]; then done_+=("$name")
            else todo=$((todo + 1)); fi
          done < <(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish != []) | .name')
          if [ "${#new[@]}" -gt 0 ]; then
            echo "::error::not on crates.io yet: ${new[*]}. Publish $VERSION by hand (.git/publish-crates.sh $VERSION), add each new crate's trusted publisher, then rerun this job."
            exit 1
          fi
          # One --exclude per published crate, and none when there are
          # none: printf with no arguments still prints its format once.
          excludes=""
          for c in ${done_[@]+"${done_[@]}"}; do excludes+="--exclude $c "; done
          echo "excludes=$excludes" >> "$GITHUB_OUTPUT"
          echo "run=$([ "$todo" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - if: steps.check.outputs.run == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          read -ra excludes <<< "$EXCLUDES"
          cargo publish --workspace --locked ${excludes[@]+"${excludes[@]}"}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          EXCLUDES: ${{ steps.check.outputs.excludes }}
