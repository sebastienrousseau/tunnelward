#
# CLA bot (D8). Asks each pull-request author to accept docs/cla/ICLA.md
# once, and records signatures in the cla-signatures branch of this
# repository. It runs on pull_request_target so it can comment on pull
# requests from forks; it never checks out or runs the pull request's code.
# The maintainer is allow-listed. Companies that signed the CCLA have their
# employees added to the allow list.
#
# The cla-signatures branch must exist before the first run (the action
# does not create it). On its first run the action writes
# signatures/cla.json there and fails once by design; reruns pass.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the Tunnelward Individual CLA and I accept it.'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/sebastienrousseau/tunnelward/blob/main/docs/cla/ICLA.md
          branch: cla-signatures
          allowlist: sebastienrousseau,dependabot[bot]
          custom-pr-sign-comment: I have read the Tunnelward Individual CLA and I accept it.
          lock-pullrequest-aftermerge: false
