#
# cargo-deny: advisories, licences, bans and sources. Run by `cargo xtask ci`.

[graph]
all-features = true

[advisories]
# Every advisory fails the gate; an ignore needs a written reason and the
# maintainer's sign-off, never a quiet entry here.
yanked = "deny"
ignore = []

[licenses]
# GPL-3.0-only is the workspace's own licence. Each licence a new
# dependency brings is added here in the same change, and must be
# compatible with distribution under GPL-3.0.
allow = [
  "GPL-3.0-only",
  "Apache-2.0", # the serde family and proptest, dual MIT
  "MIT",        # cbor4ii; the serde family
  "Unicode-3.0", # unicode-ident's Unicode data tables
  "ISC",         # rustls, rustls-webpki, aws-lc-rs, aws-lc-sys, untrusted
  "BSD-3-Clause", # code inside aws-lc-sys
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between the workspace's own unpublished crates carry
# no version; registry dependencies still may not be wildcards.
allow-wildcard-paths = true
# A duplicate needs an entry in `skip` naming who pulls the older copy
# in and when it can go.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
