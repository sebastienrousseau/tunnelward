#
# Tunnelward workspace. One crate per concern so the protocol core can be
# fuzzed and audited on its own, and so the boundary between the open
# crates and any later enterprise crate is a crate boundary, not a cfg.

[workspace]
resolver = "3"
members = [
  "crates/tw-attest",
  "crates/tw-audit",
  "crates/tw-cli",
  "crates/tw-connector",
  "crates/tw-crypto",
  "crates/tw-gateway",
  "crates/tw-identity",
  "crates/tw-mcp",
  "crates/tw-policy",
  "crates/tw-proto",
  "crates/tw-testpki",
  "crates/xtask",
]

[workspace.package]
version = "0.0.11"
edition = "2024"
# The MSRV floor. See docs/POLICIES.md before changing it.
rust-version = "1.89"
license = "GPL-3.0-only"
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
repository = "https://github.com/sebastienrousseau/tunnelward"
homepage = "https://satellion.com/tunnelward/"
readme = "README.md"

[workspace.dependencies]
# Workspace crates. The version pins what a published crate depends on;
# it moves with workspace.package.version on every release.
tunnelward-proto = { path = "crates/tw-proto", version = "=0.0.11" }
tunnelward-crypto = { path = "crates/tw-crypto", version = "=0.0.11" }
tunnelward-connector = { path = "crates/tw-connector", version = "=0.0.11" }
tunnelward-gateway = { path = "crates/tw-gateway", version = "=0.0.11" }
tunnelward-mcp = { path = "crates/tw-mcp", version = "=0.0.11" }
tunnelward-identity = { path = "crates/tw-identity", version = "=0.0.11" }
tunnelward-testpki = { path = "crates/tw-testpki" }
cbor4ii = { version = "1.2.4", default-features = false, features = ["serde1", "use_std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
serde_bytes = { version = "0.11.19", default-features = false, features = ["std"] }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
hyper = { version = "1.12.0", default-features = false }
h2 = { version = "0.4.20", default-features = false }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1.5", default-features = false }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
http = { version = "1.5.0", default-features = false, features = ["std"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Complexity ceilings (thresholds in clippy.toml). Deny, so CI fails on a
# function that crosses one instead of reporting it.
cognitive_complexity = "deny"
too_many_lines = "deny"
# Panics are bugs in a network daemon: no unwrap or expect outside tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
