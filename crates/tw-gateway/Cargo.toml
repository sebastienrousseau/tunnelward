[package]
name = "tunnelward-gateway"
description = "Tunnelward gateway: ingress, routing, admission and admin API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["tunnel", "mcp", "reverse-proxy", "gateway", "http2"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
aws-lc-rs.workspace = true
bytes.workspace = true
h2.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tunnelward-crypto.workspace = true
tunnelward-identity.workspace = true
tunnelward-mcp.workspace = true
tunnelward-proto = { workspace = true, features = ["io"] }

[dev-dependencies]
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tunnelward-connector.workspace = true
tunnelward-testpki.workspace = true

[lints]
workspace = true
