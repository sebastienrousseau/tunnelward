#
# TEST-ONLY certificates and keys shared by the workspace's tests. Never a
# normal dependency of any crate.

[package]
name = "tunnelward-testpki"
description = "TEST-ONLY certificates and keys for Tunnelward's tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tunnelward-crypto.workspace = true

# The fake Workload API agent.
[target.'cfg(unix)'.dependencies]
bytes.workspace = true
http.workspace = true
hyper = { workspace = true, features = ["server", "http2"] }
hyper-util.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync"] }

[lints]
workspace = true
