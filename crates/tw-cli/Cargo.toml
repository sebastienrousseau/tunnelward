[package]
name = "tunnelward"
description = "The tunnelward command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["tunnel", "mcp", "reverse-proxy", "post-quantum", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "tunnelward"
path = "src/main.rs"

[dependencies]
aws-lc-rs.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
toml.workspace = true
tunnelward-connector.workspace = true
tunnelward-crypto.workspace = true
tunnelward-gateway.workspace = true
tunnelward-identity.workspace = true
tunnelward-policy.workspace = true
tunnelward-proto.workspace = true

[dev-dependencies]
tunnelward-testpki.workspace = true

[lints]
workspace = true
