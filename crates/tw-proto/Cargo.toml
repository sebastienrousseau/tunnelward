[package]
name = "tw-proto"
description = "Tunnelward wire protocol: register frames, limits and error codes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Not published until the crate has an API worth depending on.
publish = false

[dependencies]
cbor4ii.workspace = true
serde.workspace = true
serde_bytes.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }

[features]
# Async frame reading and writing over tokio streams.
io = ["dep:tokio"]

[dev-dependencies]
cbor4ii.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
