[package]
name = "tunnelward-crypto"
description = "Tunnelward TLS configuration with hybrid post-quantum key exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["tls", "post-quantum", "ml-kem", "rustls", "mtls"]
categories = ["cryptography", "network-programming"]

# NIST's ML-DSA vectors carry NIST's licence, not this crate's: they and
# the test that reads them stay in the repository.
exclude = ["tests/ml_dsa_acvp.rs", "tests/vectors"]

[dependencies]
# Composite ML-DSA-65 + Ed25519 signatures.
aws-lc-rs.workspace = true
rustls.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
tunnelward-testpki.workspace = true

[lints]
workspace = true
