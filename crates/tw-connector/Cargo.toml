[package]
name = "tw-connector"
description = "Tunnelward connector: outbound registration and stdio bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Not published until the crate has an API worth depending on.
publish = false

[dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tokio-rustls.workspace = true
tw-crypto = { path = "../tw-crypto" }
tw-proto = { path = "../tw-proto", features = ["io"] }

[lints]
workspace = true
