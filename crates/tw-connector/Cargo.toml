[package]
name = "tunnelward-connector"
description = "Tunnelward connector: outbound registration and stdio bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["tunnel", "mcp", "reverse-proxy", "http2", "firewall"]
categories = ["network-programming", "web-programming::http-client"]

[dependencies]
# Session ids for the stdio bridge.
aws-lc-rs.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
serde_json.workspace = true
tokio-rustls.workspace = true
tunnelward-crypto.workspace = true
tunnelward-proto = { workspace = true, features = ["io"] }

[lints]
workspace = true
