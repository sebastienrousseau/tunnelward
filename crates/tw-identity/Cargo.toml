[package]
name = "tunnelward-identity"
description = "Tunnelward workload identity: X.509-SVIDs, their SPIFFE IDs, the SPIFFE Workload API, and enrolment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["spiffe", "svid", "x509", "identity", "mtls"]
categories = ["authentication", "cryptography", "network-programming"]

[dependencies]
# Enrolment: P-256 keys, signing requests and the CA's signatures.
aws-lc-rs.workspace = true
tunnelward-proto.workspace = true

# The Workload API client: gRPC over a Unix socket.
[target.'cfg(unix)'.dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
tunnelward-testpki.workspace = true

[target.'cfg(unix)'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
