#
# cargo-fuzz targets. Outside the workspace: libFuzzer needs nightly and
# its own lockfile. Run with `cargo xtask fuzz` (see DEVELOPMENT.md).

[package]
name = "tw-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
tunnelward-proto = { path = "../crates/tw-proto" }
tunnelward-gateway = { path = "../crates/tw-gateway" }

[workspace]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy"
path = "fuzz_targets/proxy.rs"
test = false
doc = false
bench = false
