{{- $dir := include "tunnelward.dir" . -}}
{{- $tls := required "tls.connectorsSecret: a Secret with tls.crt, tls.key and ca.crt" .Values.tls.connectorsSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tunnelward.fullname" . }}
  labels:
    {{- include "tunnelward.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tunnelward.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tunnelward.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "tunnelward.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["gateway", "--config", "{{ $dir }}/config/tunnelward.toml"]
          ports:
            - name: connectors
              containerPort: {{ .Values.containerPorts.connectors }}
            - name: agents
              containerPort: {{ .Values.containerPorts.agents }}
            {{- if .Values.admin.enabled }}
            - name: admin
              containerPort: {{ .Values.admin.port }}
            {{- end }}
          env:
            {{- if .Values.admin.enabled }}
            - name: TUNNELWARD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "admin.tokenSecret.name: the admin API needs a token off loopback" .Values.admin.tokenSecret.name }}
                  key: {{ .Values.admin.tokenSecret.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Probes are TCP: the admin API wants a bearer token, which a
          # kubelet probe cannot read from a Secret.
          startupProbe:
            tcpSocket:
              port: connectors
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: connectors
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: agents
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: {{ $dir }}/config
              readOnly: true
            # Whole-directory mounts, not subPath, so renewed certificates
            # reach the gateway's reload.
            - name: tls
              mountPath: {{ $dir }}/tls
              readOnly: true
            {{- if .Values.tls.ingressSecret }}
            - name: ingress-tls
              mountPath: {{ $dir }}/ingress
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tunnelward.fullname" . }}
        - name: tls
          secret:
            secretName: {{ $tls }}
        {{- with .Values.tls.ingressSecret }}
        - name: ingress-tls
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
